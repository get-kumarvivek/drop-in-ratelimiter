apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratelimiter-api
  namespace: ratelimiter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ratelimiter-api
  template:
    metadata:
      labels:
        app: ratelimiter-api
    spec:
      containers:
        - name: ratelimiter-api
          image: YOUR_ECR_IMAGE:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ratelimiter-api
  namespace: ratelimiter
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  selector:
    app: ratelimiter-api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: LoadBalancer
